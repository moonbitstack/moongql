name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: MoonBit version
        run: |
          moon version --all
          moon update

      # The showcase page runs the library itself, so the library is compiled to
      # JavaScript here. The bundle is a build product: it is ignored by git and
      # only ever exists inside this job's workspace.
      - name: Build the browser engine
        run: |
          moon build --target js
          mkdir -p docs/engine
          cp _build/js/debug/build/examples/browser/browser.js docs/engine/moongql.js

      - name: Regenerate the API reference
        run: |
          python3 scripts/gen_docs.py
          git diff --exit-code docs/api.html

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
